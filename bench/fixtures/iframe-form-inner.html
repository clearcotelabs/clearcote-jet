<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact sales form</title>
<style>:root{--accent:#be123c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;background:#f5f6f8}
a{color:var(--accent)}
.topbar{background:#111827;color:#d1d5db;font-size:13px;text-align:center;padding:7px 12px}
.topbar a{color:#fff}
header.site{background:#fff;border-bottom:1px solid #e5e7eb}
.hwrap{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:14px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;color:var(--accent);text-decoration:none;letter-spacing:-.3px}
.logo span{color:#111827}
nav.main{display:flex;gap:18px;flex-wrap:wrap}
nav.main a{color:#374151;text-decoration:none;font-weight:500}
nav.main a:hover{color:var(--accent)}
.hright{margin-left:auto;display:flex;gap:14px;align-items:center}
.hright a{color:#374151;text-decoration:none;font-size:14px}
.hsearch{width:220px;padding:7px 10px;border:1px solid #d1d5db;border-radius:18px;font:inherit;font-size:14px}
.crumbs{max-width:1140px;margin:0 auto;padding:12px 20px 0;font-size:13px;color:#6b7280}
.crumbs a{color:#6b7280}
main{max-width:1140px;margin:0 auto;padding:22px 20px 64px}
h1{font-size:28px;margin:6px 0 14px;letter-spacing:-.4px}
h2{font-size:20px;margin:22px 0 10px}
footer.site{background:#111827;color:#9ca3af;padding:40px 20px 24px;font-size:14px}
.fwrap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
footer.site h4{color:#f9fafb;margin:0 0 10px;font-size:14px}
footer.site a{color:#9ca3af;text-decoration:none;display:block;margin:5px 0}
.legal{max-width:1140px;margin:26px auto 0;border-top:1px solid #374151;padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.legal a{display:inline;margin-left:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:22px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=search],input[type=number],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.secondary{background:#fff;color:#374151;border:1px solid #cbd5e1}
.btn.ghost{background:transparent;color:var(--accent);border:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:#b91c1c;font-size:13px;margin-top:4px}
.errbox{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:10px 14px;border-radius:8px;margin:12px 0;font-size:14px}
.ok{background:#ecfdf5;border:1px solid #10b981;color:#065f46;padding:12px 16px;border-radius:8px;margin:16px 0}
.muted{color:#6b7280;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.row{display:flex;gap:12px;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-weight:400;margin:8px 0}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:#3730a3}
.hidden{display:none!important}
@media (max-width:760px){.fwrap{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.hsearch{display:none}}
body{background:#fff;padding:18px}</style></head>
<body><div id="box"><h2 style="margin-top:0">Get in touch</h2>
<form id="f" novalidate>
 <div class="grid2"><div><label for="fn">First name*</label><input id="fn" type="text"></div><div><label for="ln">Last name*</label><input id="ln" type="text"></div></div>
 <label for="em">Work email*</label><input id="em" type="email">
 <label for="co">Company name*</label><input id="co" type="text">
 <label for="size">Team size*</label><select id="size"><option value="">Please select</option><option>1-10</option><option>11-50</option><option>51-200</option><option>201-1000</option><option>1000+</option></select>
 <label for="msg">How can we help?</label><textarea id="msg" rows="3"></textarea>
 <label class="check"><input type="checkbox" id="news"> Keep me updated about Cargoline products</label>
 <div id="err" class="err"></div>
 <button class="btn" type="submit" style="margin-top:12px">Submit</button>
 <p class="muted">By submitting you agree to our privacy policy.</p>
</form></div>
<script>
function report(id, data){
  return fetch('/api/done/' + id, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
}

function v(id){ return document.getElementById(id).value.trim(); }
document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  if(!v('fn') || !v('ln') || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('em')) || !v('co') || !v('size')){ document.getElementById('err').textContent = 'Please complete all required fields.'; return; }
  report('local-iframe-form', {first:v('fn'), last:v('ln'), email:v('em'), company:v('co'), size:v('size'), message:v('msg'), newsletter:document.getElementById('news').checked}).then(function(){
    document.getElementById('box').innerHTML = '<h2>Thanks, ' + v('fn') + '!</h2><div class="ok">Our team will contact you within one business day.</div>'; });
};
</script></body></html>
