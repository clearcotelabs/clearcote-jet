name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and unit tests (offline, no browser, no model calls)
        run: |
          pip install -e . pytest ruff
          ruff check .
          pytest tests -q
